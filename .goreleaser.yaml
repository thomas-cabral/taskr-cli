# .goreleaser.yaml
version: 2
project_name: taskr

before:
  hooks:
    - go mod tidy

builds:
  - id: taskr
    main: ./cmd/taskr
    binary: taskr
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      # No Windows on arm64: nobody has asked, and every extra target is
      # another archive to keep honest.
      - goos: windows
        goarch: arm64

archives:
  - id: taskr
    # install.sh builds this exact name. Changing it breaks the installer
    # for every existing user, silently, because the download 404s.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github

release:
  draft: false
  prerelease: auto
