# .goreleaser.yaml
version: 2
project_name: taskr

before:
  hooks:
    - go mod tidy

builds:
  - id: taskr
    main: ./cmd/taskr
    binary: taskr
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Spelled out because goreleaser's default ldflags inject main.version,
    # and every line of version code lives in package cli — so the release
    # number was being linked into a symbol nothing reads, and `taskr
    # version` could not answer which release it was. -s -w are goreleaser's
    # own defaults, repeated here because naming ldflags REPLACES the
    # defaults rather than adding to them.
    ldflags:
      - -s -w -X github.com/thomas-cabral/taskr-cli/cli.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      # No Windows on arm64: nobody has asked, and every extra target is
      # another archive to keep honest.
      - goos: windows
        goarch: arm64

archives:
  - id: taskr
    # install.sh builds this exact name. Changing it breaks the installer
    # for every existing user, silently, because the download 404s.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github

release:
  draft: false
  prerelease: auto
